# ==============================================================================
# Hyprlock Configuration - Styled for Antigravity Desktop Theme
# ==============================================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# Live screenshot blur background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time (Large Digital Clock)
label {
    monitor =
    text = $TIME
    color = rgb(182, 255, 46) # #B6FF2E
    font_size = 76
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(143, 161, 179) # #8fa1b3
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# User Greeting / Host
label {
    monitor =
    text = 󰌽  $USER
    color = rgb(182, 255, 46) # #B6FF2E
    font_size = 15
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -15
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(182, 255, 46, 0.9) # #B6FF2E
    inner_color = rgba(31, 35, 41, 0.95) # #1F2329
    font_color = rgb(182, 255, 46)
    fade_on_empty = false
    placeholder_text = <span foreground="##8fa1b3"><i>Enter Password...</i></span>
    hide_input = false
    rounding = 6
    check_color = rgb(182, 255, 46)
    fail_color = rgb(255, 108, 107) # #ff6c6b
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    position = 0, -80
    halign = center
    valign = center
}
